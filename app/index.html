<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Linkbery collects online courses from Coursera, Udemy, edX, Guvi, Simplilearn, YouTube and more so you can search, compare and save them in one place." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the saved theme before first paint. Dark unless the user chose light.
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('linkbery.theme') === 'light') t = 'light';
        } catch (e) {
          // storage unavailable: keep dark
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>Linkbery - find the right course</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
